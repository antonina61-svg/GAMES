<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c9f3f3">
<title>Навчально-розвивальні ігри для казкових дітей</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#c9f3f3;color:#08008d;font-family:"Trebuchet MS",Arial,sans-serif}
.page{width:min(100%,980px);min-height:100vh;margin:auto;padding:22px 34px 30px;display:flex;flex-direction:column;align-items:center}
.hero{width:min(100%,690px);display:flex;align-items:center;justify-content:center;gap:34px;margin:0 auto 22px}
.avatar{width:164px;height:164px;object-fit:cover;border:6px solid #0755b5;border-radius:50%;background:white;flex:none}
h1{margin:0;color:#f04432;font-family:"Comic Sans MS","Trebuchet MS",cursive;font-size:clamp(25px,4vw,39px);line-height:1.08;font-style:italic;font-weight:800;text-align:center;transform:rotate(-1deg)}
.instructions{width:min(100%,590px);margin:0 auto;padding-left:30px;font-size:clamp(19px,3vw,27px);line-height:1.45;font-weight:800;letter-spacing:.3px}
.sparkle{display:grid;place-items:center;width:56px;height:46px;margin:15px auto 12px;border-radius:17px;color:#d8ffff;background:linear-gradient(145deg,#4f8bb1,#31668f);font-size:23px}
h2{margin:0 0 44px;color:#f04432;font-size:29px;letter-spacing:1px;text-align:center}
.games{width:min(100%,680px);display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:auto;padding-bottom:28px}
.game{min-width:0;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;border-radius:12px;text-decoration:none;transition:transform .18s,background .18s}
.game:hover,.game:focus-visible{transform:translateY(-3px);background:#ffffff55;outline:2px solid #0755b5;outline-offset:3px}
.game img{width:68px;height:58px;object-fit:contain;flex:none}.game-copy{text-align:center}
.game-title{display:block;color:#ef4435;font-size:17px;font-weight:800;line-height:1.05}
.game-action{display:block;margin-top:4px;color:#08008d;font-size:15px;font-style:italic;font-weight:800;line-height:1.12}
@media(max-width:620px){.page{padding:20px 18px 24px}.hero{gap:15px}.avatar{width:116px;height:116px;border-width:4px}.instructions{padding-left:24px}h2{margin-bottom:24px}.games{grid-template-columns:1fr;gap:12px}.game{justify-content:flex-start;max-width:330px;margin:auto;width:100%}.game-copy{flex:1}}
@media(max-width:390px){.hero{flex-direction:column}.avatar{width:130px;height:130px}}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main class="page">
<header class="hero">
<img class="avatar" src="./index-assets/avatar.png" alt="Весела героїня">
<h1>Вітаю на сторінці<br>навчально-<br>розвивальних ігор для<br>казкових дітей!</h1>
</header>
<ul class="instructions">
<li>Оберіть потрібну гру.</li>
<li>Натисніть на назву файлу з html.</li>
<li>Грайте разом з дитиною.</li>
</ul>
<div class="sparkle" aria-hidden="true">✦</div>
<h2>ІГРИ:</h2>
<nav class="games" aria-label="Навчальні ігри">
<a class="game" href="./Z%20yakogo%20dereva%20listok.html">
<img src="./index-assets/leaf.png" alt="">
<span class="game-copy">
<span class="game-title">«З якого дерева<br>листок»</span>
<span class="game-action">Відкрити сторінку<br>Z yakogo dereva listok.html</span>
</span></a>
<a class="game" href="./sklad-chysla.html">
<img src="./index-assets/math.png" alt="">
<span class="game-copy">
<span class="game-title">«Склад числа»</span>
<span class="game-action">Відкрити сторінку<br>sklad-chysla.html</span>
</span></a>
</nav>
</main>
</body>
</html>
