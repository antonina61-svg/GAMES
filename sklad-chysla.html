<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад числа</title>
<style>
:root{--bg:#fff4d6;--ink:#3b2a63;--roof:#ff7a59;--wall:#fffdf7;--l:#7ed6a8;--r:#8ec5ff;--ok:#2bb673;--bad:#f2a0a0;--btn:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow-x:hidden}
.screen{display:none;width:100%;max-width:720px;flex:1;flex-direction:column;align-items:center;padding:14px 0}
.screen.on{display:flex}
h1{font-size:clamp(2rem,8vw,3.4rem);margin:8px 0 4px;text-align:center;letter-spacing:.5px}
.sub{font-size:1.15rem;margin:0 0 14px;text-align:center}
button{font:inherit;color:var(--ink);cursor:pointer;border:0;border-radius:22px;background:var(--btn);box-shadow:0 6px 0 #d49a00;padding:12px 20px;font-size:1.3rem;font-weight:700;transition:transform .08s}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #d49a00}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.menu{display:grid;gap:16px;width:100%;margin-top:6px}
.menu .big{font-size:1.6rem;padding:20px;text-align:left;display:flex;gap:14px;align-items:center}
.menu .big span.e{font-size:2.4rem}
.menu .big small{display:block;font-size:1rem;font-weight:400}
.nums{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 10px}
.nums button{width:58px;height:58px;padding:0;border-radius:50%;font-size:1.6rem;background:#fff;box-shadow:0 5px 0 #c9bfa5}
.nums button.sel{background:var(--roof);color:#fff;box-shadow:0 5px 0 #c24a2b}
.nums button.all{width:auto;border-radius:29px;padding:0 18px;font-size:1.2rem}
.top{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}
.top button{font-size:1.1rem;padding:8px 14px;border-radius:16px}
.stars{font-size:1.5rem;min-height:2rem;letter-spacing:2px}
.task{font-size:clamp(1.2rem,5vw,1.7rem);font-weight:700;text-align:center;margin:10px 0;min-height:2.2em}
.house{width:min(92vw,520px);margin:6px auto}
.roof{height:clamp(80px,20vw,120px);background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.roof b{font-size:clamp(2.4rem,9vw,3.6rem);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.rooms{display:flex;gap:6px;background:#c98a5a;padding:6px;border-radius:0 0 16px 16px}
.room{flex:1;min-height:clamp(120px,32vw,170px);border-radius:10px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;padding:6px;background:var(--wall)}
.room.l{background:#e4f8ec}.room.r{background:#e3f0ff}
.room img{height:clamp(46px,13vw,66px);width:auto;max-width:44%;object-fit:contain;animation:pop .35s both;pointer-events:none}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.digits{display:flex;gap:6px;margin-top:6px}
.digits div{flex:1;text-align:center;font-size:clamp(2rem,8vw,3rem);font-weight:800;min-height:1.3em}
.q{color:var(--roof);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.opts button{width:clamp(64px,19vw,92px);height:clamp(64px,19vw,92px);padding:0;font-size:2.4rem;border-radius:24px;background:#fff;box-shadow:0 7px 0 #c9bfa5}
.opts button.ok{background:var(--ok);color:#fff;box-shadow:0 7px 0 #17804f}
.opts button.no{background:var(--bad);box-shadow:0 7px 0 #c97070;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips button{font-size:1.4rem;background:#fff;box-shadow:0 5px 0 #c9bfa5;padding:8px 14px}
.chips button.sel{background:var(--l);box-shadow:0 5px 0 #3f9d70}
.msg{font-size:1.4rem;font-weight:800;min-height:1.6em;text-align:center;color:var(--ok);margin-top:10px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx span{position:absolute;top:-40px;font-size:2rem;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<section id="menu" class="screen on">
  <h1>🏠 Склад числа</h1>
  <p class="sub">Гра з числами до 6. Обери, з якими числами гратимемо:</p>
  <div class="nums" id="numPick"></div>
  <p class="sub" id="voiceHint" style="display:none;font-size:1rem;color:#b3402a">⚠ Для правильної вимови потрібен український голос у налаштуваннях пристрою.</p>
  <div class="menu">
    <button class="big" data-mode="explore"><span class="e">👀</span><div>Вчимося<small>Дивись, з яких частин складається число</small></div></button>
    <button class="big" data-mode="missing"><span class="e">🧩</span><div>Чого не вистачає?<small>Знайди другу частину числа</small></div></button>
    <button class="big" data-mode="total"><span class="e">🍎</span><div>Скільки разом?<small>Об’єднай дві частини в число</small></div></button>
  </div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button id="back">⬅ Назад</button>
    <div class="stars" id="stars"></div>
    <button id="say">🔊</button>
  </div>
  <div class="task" id="task"></div>
  <div class="nums" id="exTabs" style="display:none"></div>
  <div class="house">
    <div class="roof"><b id="rn"></b></div>
    <div class="rooms"><div class="room l" id="L"></div><div class="room r" id="R"></div></div>
    <div class="digits"><div id="dl"></div><div id="dr"></div></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="opts" id="opts"></div>
  <div class="chips" id="chips"></div>
</section>

<div id="fx"></div>

    setTimeout(()=>speechSynthesis.speak(u),80);
    if(cb)setTimeout(fin,9000);
  }catch(e){if(cb)setTimeout(fin,2600);}
}
const TT={'щоб вийшло':', щоб вийшло','Так':'Так!','Правильно':'Правильно!','Вірно':'Вірно!'};
let lastSay=null,seqTok=0;
function say(keys,cb,end){
  lastSay=[keys,end];lastSpeech=keys.join(' ');
  const R=window.REC;
  if(R&&keys.every(k=>R[k])){
    const tok=++seqTok;try{speechSynthesis.cancel()}catch(e){}
    let i=0,fin=false;const done=()=>{if(!fin){fin=true;cb&&cb();}};
    const step=()=>{if(tok!==seqTok)return;if(i>=keys.length){done();return;}
      const a=new Audio(R[keys[i++]]);a.onended=()=>setTimeout(step,70);a.onerror=done;a.play().catch(done);};
    step();return;
  }
  seqTok++;
  speak(keys.map(k=>TT[k]||k).join(' ').replace(/ ,/g,',')+(end||''),cb);
}
function confetti(n=26){
  const f=$('fx'),em=['⭐','🎉','🎈','✨','🌟'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=Math.random()*.4+'s';
    f.appendChild(s);setTimeout(()=>s.remove(),3800);}
}

/* ---------- допоміжне ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function items(el,e,n){el.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('img');s.src=IMGS[e];s.alt=ALT[e];s.draggable=false;s.style.animationDelay=(i*.08)+'s';el.appendChild(s);}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
function setStars(){$('stars').textContent=mode==='explore'?'':'⭐'.repeat(score%10)+(score>=10?'':'');}
function clearBoard(){['L','R','dl','dr','msg','opts','chips'].forEach(i=>$(i).innerHTML='');$('rn').textContent='';}

/* ---------- меню ---------- */
function drawNumPick(){
  const box=$('numPick');box.innerHTML='';
  [2,3,4,5,6].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=sel.includes(n)?'sel':'';
    b.onclick=()=>{if(sel.includes(n)){if(sel.length>1)sel=sel.filter(x=>x!==n);}else sel.push(n);drawNumPick();};box.appendChild(b);});
  const a=document.createElement('button');a.textContent='усі';a.className='all'+(sel.length===5?' sel':'');
  a.onclick=()=>{sel=[2,3,4,5,6];drawNumPick();};box.appendChild(a);
}
drawNumPick();
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));
$('back').onclick=()=>{seqTok++;try{speechSynthesis.cancel()}catch(e){};show('menu');};
$('say').onclick=()=>{if(lastSay)say(lastSay[0],null,lastSay[1]);};

function start(m){
  mode=m;score=0;cur=null;show('game');setStars();
  $('exTabs').style.display=m==='explore'?'flex':'none';
  if(m==='explore'){exN=sel[0];exI=1;drawTabs();explore();}else next();
}

/* ---------- режим «Вчимося» ---------- */
function drawTabs(){
  const box=$('exTabs');box.innerHTML='';
  [2,3,4,5,6].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.className=n===exN?'sel':'';
    b.onclick=()=>{exN=n;exI=1;drawTabs();explore();};box.appendChild(b);});
}
function explore(){
  const e=THEMES[exN%THEMES.length], a=exI, b=exN-exI;
  clearBoard();
  $('task').textContent='Число '+exN+' складається з двох частин';
  $('rn').textContent=exN;
  items($('L'),e,a);items($('R'),e,b);
  $('dl').textContent=a;$('dr').textContent=b;
  const ch=$('chips');
  for(let i=1;i<exN;i++){const c=document.createElement('button');c.textContent=i+' + '+(exN-i);c.className=i===exI?'sel':'';
    c.onclick=()=>{exI=i;explore();};ch.appendChild(c);}
  const nx=document.createElement('button');nx.textContent='Далі ▶';nx.onclick=()=>{exI=exI%(exN-1)+1;explore();};ch.appendChild(nx);
  $('msg').textContent=a+' + '+b+' = '+exN;
  tone([523,659]);say([WORDS[a],'плюс',WORDS[b],'дорівнює',WORDS[exN]],null,'.');
}

/* ---------- ігрові режими ---------- */
function makeQ(){
  let N,a,b,e,key;
  do{N=pick(sel);a=1+rnd(N-1);b=N-a;e=pick(THEMES);key=mode+N+a;}while(cur&&cur.key===key&&sel.length>1||cur&&cur.key===key&&N>2);
  return {N,a,b,e,key};
}
function next(){
  locked=false;cur=makeQ();clearBoard();const {N,a,b,e}=cur;
  if(mode==='missing'){
    $('task').textContent='Скільки треба додати, щоб вийшло '+N+'?';
    $('rn').textContent=N;items($('L'),e,a);$('dl').textContent=a;
    $('dr').innerHTML='<span class="q">?</span>';
    say(['Скільки треба додати до',GEN[a],'щоб вийшло',WORDS[N]],null,'?');
    buttons(shuffle(Array.from({length:N-1},(_,i)=>i+1).concat(N>2?[]:[N])),b);
  }else{
    $('task').textContent='Скільки всього?';
    $('rn').innerHTML='<span class="q">?</span>';
    items($('L'),e,a);items($('R'),e,b);$('dl').textContent=a;$('dr').textContent=b;
    say(['Скільки буде',WORDS[a],'плюс',WORDS[b]],null,'?');
    const o=new Set([N]);while(o.size<Math.min(4,5)){const x=2+rnd(5);o.add(x);}
    buttons(shuffle([...o]).sort((p,q)=>p-q),N);
  }
}
function buttons(list,right){
  const box=$('opts');box.innerHTML='';
  list.forEach(v=>{const bt=document.createElement('button');bt.textContent=v;
    bt.onclick=()=>answer(bt,v,right);box.appendChild(bt);});
}
function answer(bt,v,right){
  if(locked)return;
  if(v!==right){bt.classList.add('no');bt.disabled=true;tone([300,240]);$('msg').style.color='#c26060';$('msg').textContent='Спробуй ще раз!';return;}
  locked=true;bt.classList.add('ok');$('msg').style.color='';
  const {N,a,b,e}=cur;
  if(mode==='missing'){items($('R'),e,b);$('dr').textContent=b;}else{$('rn').textContent=N;}
  score++;setStars();tone([523,659,784]);
  const praise=pick(['Так!','Правильно!','Вірно!']);
  $('msg').textContent=praise+' '+a+' + '+b+' = '+N;
  const q=cur;
  if(score%5===0){confetti(40);}else confetti(10);
  say([praise.replace('!',''),WORDS[a],'плюс',WORDS[b],'дорівнює',WORDS[N]],()=>{
    setTimeout(()=>{if(cur===q&&$('game').classList.contains('on'))next();},900);
  },'.');
}
</script>
