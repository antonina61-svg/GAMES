<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>З якого дерева листок?</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#4a2f17;user-select:none;overflow-x:hidden;
background:linear-gradient(#bfe4ff 0,#f4fbff calc(100% - 16px),#8ccb62 calc(100% - 16px)) fixed}
#game.nofx *{animation:none!important}
.screen{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(3px,1vh,10px);padding:46px 8px 6px;text-align:center}
.inv{visibility:hidden}
#start{position:relative;background:linear-gradient(#9fd8ff,#e6f5ff)}
#start>*:not(#scatter){position:relative;z-index:1}
#scatter{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#scatter img{position:absolute;filter:drop-shadow(0 6px 5px #0003)}
#game.screen{display:grid;grid-template-rows:1fr 1fr;align-items:stretch;justify-items:center;gap:0;padding:44px 8px 6px}
#top{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0}
#lq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vmin}
body.land #lq{flex-direction:row;gap:4vmin}
#qa{display:grid;justify-items:center;align-items:center}
#qa>*{grid-area:1/1}
#q{max-width:94vw}
body.land #q{max-width:36vw}
#bottom{display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
#leafbox{height:var(--lh,200px);flex:none}
#leafbox img{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 6px #0003);animation:fall 1s ease-out}
#title{font-family:"Arial Black","Arial Rounded MT Bold",Impact,system-ui,sans-serif;font-weight:900;font-size:var(--ts,40px);line-height:1.12;max-width:98vw;color:#ff9a1f;letter-spacing:.01em;-webkit-text-stroke:2px #fff3d6;paint-order:stroke fill;text-shadow:0 1px 0 hsl(28,100%,50%),0 2px 0 hsl(28,100%,48%),0 3px 0 hsl(28,100%,45%),0 4px 0 hsl(28,100%,43%),0 5px 0 hsl(28,100%,41%),0 6px 0 hsl(28,100%,39%),0 7px 0 hsl(28,100%,37%),0 8px 0 hsl(28,100%,34%),0 16px 14px rgba(60,30,0,.3)}
#by{margin:0 0 2vmin;font-style:italic;font-size:var(--bs,14px);color:#14502a}
.hide{display:none!important}
#vol{position:fixed;top:10px;left:10px;z-index:10;display:flex;align-items:center;gap:8px;background:#fff;border-radius:30px;padding:3px 12px;box-shadow:0 3px 0 #0002}
#vi{font-size:clamp(18px,4vw,24px)}
#vr{-webkit-appearance:none;appearance:none;width:min(32vw,170px);height:12px;border-radius:6px;background:linear-gradient(90deg,#ffd9a8,#ff8a1f);outline:0;cursor:pointer}
#vr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid #ff8a1f}
#vr::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid #ff8a1f}
#mus{position:fixed;top:10px;right:10px;z-index:10;font-size:clamp(18px,4vw,24px);background:#fff;border:0;border-radius:50%;width:1.9em;height:1.9em;box-shadow:0 4px 0 #0002;cursor:pointer}
h1{font-size:clamp(22px,min(5vw,6.5vh),40px);margin:0;line-height:1.1}
.btn{font:inherit;font-size:clamp(16px,min(4vw,4.6vh),28px);background:#ff8a1f;color:#fff;border:0;border-radius:40px;padding:.4em 1.3em;box-shadow:0 6px 0 #c25f00;cursor:pointer}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c25f00}
#prog{display:flex;gap:4px;font-size:clamp(14px,min(3.6vw,3.8vh),24px)}
#prog span{opacity:.35;filter:grayscale(1)}
#prog span.s{opacity:1;filter:none}
#prog span.c{opacity:1;filter:none;transform:scale(1.25)}
@keyframes fall{0%{transform:translateY(-120%) rotate(-40deg);opacity:0}60%{transform:translateY(8%) rotate(15deg);opacity:1}100%{transform:none}}
#q{font-size:clamp(14px,min(3.4vw,3.6vh),24px);display:flex;align-items:center;gap:10px}
#choices{display:flex;gap:10px;justify-content:center;flex-wrap:nowrap}
.card{background:#fff;border:4px solid #fff;border-radius:20px;box-shadow:0 6px 0 #0002;padding:4px 3px 4px;cursor:pointer;font:inherit;color:inherit;font-size:clamp(12px,min(2.8vw,2.8vh),20px);line-height:1.15}
.card img{height:var(--ch,120px);width:auto;aspect-ratio:2/3;object-fit:cover;display:block;margin:0 auto 3px;border-radius:14px;pointer-events:none}
.card:active{transform:translateY(4px)}
.card.ok{border-color:#3cb043;background:#eaffe6;animation:hop .6s}
.card.no{border-color:#e65a4f;background:#ffeceb;opacity:.55;animation:shake .5s}
@keyframes hop{30%{transform:translateY(-22px) scale(1.06)}60%{transform:none}80%{transform:translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fly{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:drop linear forwards;z-index:9}
@keyframes drop{to{transform:translateY(110vh) rotate(360deg)}}
#res{font-size:clamp(28px,min(8vw,10vh),64px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="vol"><span id="vi">🔊</span><input type="range" id="vr" min="0" max="1" step="0.05" value="0.7" aria-label="Гучність"></div>

<button id="mus" aria-label="Музику увімкнути або вимкнути">🔇</button>

<div id="start" class="screen">
  <div id="scatter"></div>
  <h1 id="title">Дидактична гра<br>«З&nbsp;якого дерева<br>листок?»</h1>
  <p id="by">Автор: Воліна А. (з використанням ШІ)</p>
    <button class="btn" id="go">Грати</button>
</div>

<div id="game" class="screen hide">
  <div id="top">
    <div id="prog"></div>
    <div id="lq">
      <div id="leafbox"></div>
      <div id="qa"><div id="q">Натисни на дерево, з якого цей листок.</div><button class="btn inv" id="nx">Далі ➜</button></div>
    </div>
  </div>
  <div id="bottom"><div id="choices"></div></div>
</div>

<div id="end" class="screen hide">
  <h1>Молодець!</h1>
  <div id="res"></div>
  <div id="endmsg" style="font-size:clamp(14px,min(3.4vw,3.6vh),22px)"></div>
  <button class="btn" id="again">Грати ще</button>
</div>

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};


// звук и голос
let ac;
let vol=.7,master;
try{const v=parseFloat(localStorage.getItem('listok_vol'));if(v>=0&&v<=1)vol=v}catch(e){}
function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=vol;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume();return ac}
function setVol(v){vol=v;if(master)master.gain.value=v;$('vi').textContent=v===0?'🔇':v<.35?'🔈':v<.7?'🔉':'🔊';try{localStorage.setItem('listok_vol',v)}catch(e){}}
function tone(f,t,d,type,v){try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.18,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g);g.connect(master);o.start(a.currentTime+t);o.stop(a.currentTime+t+d)}catch(e){}}
// шорох падающего листка
function rustle(){try{const a=ctx(),n=a.sampleRate*.8|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2)*(Math.random()<.3?1:.35);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=3500;f.Q.value=.7;const g=a.createGain();g.gain.value=.4;s.connect(f);f.connect(g);g.connect(master);s.start()}catch(e){}}
// дитячі фанфари: «трубочка» + дзвіночки
function fanfare(){
 [[392,0,.13],[523,.15,.13],[659,.3,.13],[784,.45,.5],[659,1,.13],[784,1.15,.9]].forEach(([f,t,d])=>{tone(f,t,d,'square',.05);tone(f*2,t,d,'triangle',.05)});
 tone(523,1.15,.9,'triangle',.06);tone(659,1.15,.9,'triangle',.05);
 [1568,1976,2349,2637,3136].forEach((f,i)=>tone(f,1.15+i*.08,.6,'sine',.04))}
// тихая фоновая мелодия
const MEL=[392,440,523,587,659,587,523,440,392,330,392,440,523,440,392,330];
let music=false,mt,step=0,musicInit=false;
function mus(){const f=MEL[step%MEL.length];tone(f,0,.55,'sine',.05);if(step%4===0)tone(f/2,0,1.5,'triangle',.04);step++}
function setMusic(on){music=on;clearInterval(mt);if(on){mus();mt=setInterval(mus,480)}$('mus').textContent=on?'🎵':'🔇'}
function rain(emojis,n){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='fly';e.textContent=emojis[i%emojis.length];e.style.left=Math.random()*95+'vw';e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}

// игра
const ROUNDS=8;
let round,stars,cur,first,locked,prev,results;
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function drawProg(){$('prog').innerHTML=Array.from({length:ROUNDS},(_,i)=>{const r=results[i];return `<span class="${r===undefined?(i===round?'c':''):'s'}">${r===undefined?'🍂':(r?'⭐':'🍁')}</span>`}).join('')}
function start(){if(!musicInit){musicInit=true;setMusic(true)}round=0;results=[];show('game');next()}
function next(){
  if(round>=ROUNDS)return finish();
  do{cur=KEYS[Math.random()*KEYS.length|0]}while(cur===prev);prev=cur;
  first=true;locked=false;
  $('nx').classList.add('inv');$('q').classList.remove('inv');
  $('leafbox').innerHTML=leafImg(cur);rustle();
  const opts=shuf([cur,...shuf(KEYS.filter(k=>k!==cur)).slice(0,2)]);
  $('choices').innerHTML='';
  opts.forEach(k=>{const b=document.createElement('button');b.className='card';b.innerHTML=treeImg(k)+D[k].n;b.onclick=()=>pick(k,b);$('choices').appendChild(b)});
  drawProg();fit();
}
function pick(k,b){
  if(locked||b.classList.contains('no'))return;
  if(k===cur){
    locked=true;b.classList.add('ok');rain(['⭐','🍂','🍁'],14);
    results[round]=first;
    $('nx').classList.remove('inv');$('q').classList.add('inv');drawProg();
  }else{
    first=false;b.classList.add('no');
  }
}
function finish(){
  const n=results.filter(Boolean).length;
  show('end');
  $('res').textContent='⭐'.repeat(n)+'🍁'.repeat(ROUNDS-n);
  const m=n===ROUNDS?'Ти впізнав усі листочки з першого разу!':n>=5?'Дуже добре! Ти знаєш багато дерев.':'Гарна гра! Пограй ще — і запам’ятаєш усі листочки.';
  $('endmsg').textContent=m;fanfare();rain(['⭐','🍂','🍁','🌳'],24);
}
// підгонка розмірів: угорі листочок і напис, внизу дерева (по половині екрана)
const rc=e=>e.getBoundingClientRect();
function fit(){
  const g=$('game');if(g.classList.contains('hide'))return;
  const W=innerWidth,H=innerHeight,land=W/H>1.3;
  document.body.classList.toggle('land',land);
  g.classList.add('nofx');
  const half=(H-44-6)/2,cw=(W-16-20)/3-14;
  const ch=Math.min(half-48,cw*1.5);
  const lh0=Math.min(half-$('prog').offsetHeight-10-(land?0:36),ch*1.15);
  let a=1,c=1;const set=()=>{g.style.setProperty('--lh',lh0*a+'px');g.style.setProperty('--ch',ch*c+'px')};
  const overTop=()=>{const q=rc($('lq')),p=rc($('prog'));return q.bottom-p.top>half-2||q.left<6||q.right>W-6};
  const overBot=()=>{const q=rc($('choices'));return q.height>half-2||q.left<6||q.right>W-6};
  set();
  for(let i=0;i<90;i++){const t=overTop(),b=overBot();if(!t&&!b)break;if(t&&a>.2)a*=.97;if(b&&c>.2)c*=.97;set()}
  g.classList.remove('nofx');
}
// стартова сторінка: напис по центру, листочки без рамок розкидані навколо
const SL=[[.03,.07],[.79,.05],[.0,.44],[.81,.43],[.06,.72],[.74,.70]],SP=[[.02,.04],[.60,.03],[.0,.40],[.62,.42],[.04,.74],[.58,.73]];
const LEAVES=shuf([...KEYS,KEYS[Math.random()*KEYS.length|0]]).map(k=>({k,j:[Math.random(),Math.random()],r:(Math.random()-.5)*56,s:.8+Math.random()*.25}));
LEAVES.forEach(o=>{const im=new Image();im.src=IMG[o.k].l;im.alt='';o.el=im;$('scatter').appendChild(im)});
function fitStart(){
  const st=$('start');if(st.classList.contains('hide'))return;
  const W=innerWidth,H=innerHeight,land=W/H>1.3;
  const maxW=land?W*.58:W*.92,ts0=land?Math.min(W*.075,H*.13):Math.min(W*.1,H*.085);
  let k=1;const set=()=>{st.style.setProperty('--ts',ts0*k+'px');st.style.setProperty('--bs',Math.max(12,ts0*k*.3)+'px')};
  const over=()=>{const t=rc($('title')),b=rc($('by')),g=rc($('go'));return t.width>maxW||g.bottom-t.top>H-46-10};
  set();for(let i=0;i<90&&k>.2&&over();i++){k*=.97;set()}
  const base=land?Math.min(W*.18,H*.31):Math.min(W*.28,H*.17),sl=land?SL:SP;
  LEAVES.forEach((o,i)=>{const hh=base*o.s,e=o.el;e.style.height=hh+'px';
    const w=hh*(e.naturalWidth/(e.naturalHeight||1));
    e.style.left=Math.max(2,Math.min(W-w-2,(sl[i][0]+(o.j[0]-.5)*.04)*W))+'px';
    e.style.top=Math.max(2,Math.min(H-hh-2,(sl[i][1]+(o.j[1]-.5)*.05)*H))+'px';
    e.style.transform=`rotate(${o.r}deg)`});
}
fitStart();LEAVES.forEach(o=>o.el.onload=fitStart);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{fit();fitStart()},60)});
addEventListener('orientationchange',()=>setTimeout(fit,200));
$('go').onclick=start;
$('again').onclick=start;
$('nx').onclick=()=>{round++;next()};
$('vr').value=vol;setVol(vol);
$('vr').oninput=e=>setVol(parseFloat(e.target.value));
$('vr').onchange=()=>rustle();
$('mus').onclick=()=>{musicInit=true;setMusic(!music)};
</script>
